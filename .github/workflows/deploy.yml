name: Deploy Backend

# Server-Layout (symmetrisch zu nbv-webservices):
#   main -> /opt/srbasar/srbasar-backend       PM2 srbasar-backend      https://nbv-sr-basar.de/api/
#   dev  -> /opt/srbasar/dev/srbasar-backend   PM2 srbasar-backend-dev  https://nbv-sr-basar.de/dev/api/
# Die .env liegt jeweils nur auf dem Server und wird nie überschrieben.

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: srbasar-backend-deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  deploy:
    name: ${{ github.ref_name == 'main' && 'Prod' || 'Dev' }}-Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Zielumgebung bestimmen
        id: target
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "path=/opt/srbasar/srbasar-backend" >> "$GITHUB_OUTPUT"
            echo "pm2=srbasar-backend" >> "$GITHUB_OUTPUT"
            echo "health=https://nbv-sr-basar.de/api/v1/health" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_NAME" = "dev" ]; then
            echo "path=/opt/srbasar/dev/srbasar-backend" >> "$GITHUB_OUTPUT"
            echo "pm2=srbasar-backend-dev" >> "$GITHUB_OUTPUT"
            echo "health=https://nbv-sr-basar.de/dev/api/v1/health" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Kein Deploy-Ziel für Branch $GITHUB_REF_NAME"; exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Sync code to server
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude '.env.sample' \
            --exclude '.env.ballersclub' \
            --exclude 'db/database.sqlite' \
            --exclude 'logs' \
            --exclude '.DS_Store' \
            -e "ssh -i $HOME/.ssh/id_ed25519 -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ steps.target.outputs.path }}/"

      - name: Install production deps, migrate & reload on server
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
              set -euo pipefail
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              cd "${{ steps.target.outputs.path }}"
              npm ci --omit=dev
              # Additive Migration (neue Tabellen/Spalten), idempotent
              node ops/migrate.js
              # Beim ersten Deploy existiert der PM2-Prozess noch nicht -> anlegen.
              # --cwd ist wichtig, damit dotenv die .env dieses Ordners liest.
              if pm2 describe "${{ steps.target.outputs.pm2 }}" > /dev/null 2>&1; then
                pm2 reload "${{ steps.target.outputs.pm2 }}" --update-env
              else
                pm2 start src/app.js --name "${{ steps.target.outputs.pm2 }}" --cwd "$PWD"
                pm2 save
              fi
            '

      - name: Health check
        run: |
          sleep 5
          curl --fail --silent --show-error "${{ steps.target.outputs.health }}"
